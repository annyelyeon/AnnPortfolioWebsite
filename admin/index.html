<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin — Yelyeon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">Y. <span class="admin-label">Admin</span></a>
      <div class="admin-actions" id="admin-actions" hidden>
        <a class="btn" href="../index.html" target="_blank">View site</a>
        <button class="btn" id="sign-out">Sign out</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="section" id="setup" hidden>
      <div class="box narrow">
        <h1 class="h2">Connect Supabase</h1>
        <p>The editor needs a Supabase project. Fill in <code>js/config.js</code> with your project URL and anon key, then reload this page. Steps are in <code>README.md</code>.</p>
      </div>
    </section>

    <section class="section" id="login" hidden>
      <form class="box narrow" id="login-form">
        <h1 class="h2">Sign in</h1>
        <label class="field">Email
          <input type="email" name="email" required autocomplete="username">
        </label>
        <label class="field">Password
          <input type="password" name="password" required autocomplete="current-password">
        </label>
        <button class="btn primary tall" type="submit">Sign in</button>
        <p class="form-msg" role="alert"></p>
      </form>
    </section>

    <section class="section" id="dashboard" hidden>
      <div class="box">
        <div class="section-head">
          <div class="tabs" role="tablist">
            <button role="tab" data-tab="posts">Posts</button>
            <button role="tab" data-tab="projects">Projects</button>
          </div>
          <a class="btn primary" id="new-btn" href="edit.html?type=posts">+ New post</a>
        </div>
        <ul class="writing-list admin-list" id="admin-list"></ul>
      </div>
    </section>
  </main>

  <script type="module" src="admin.js"></script>
</body>
</html>
